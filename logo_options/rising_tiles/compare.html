body { margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif; background: #e9eef7; color: #14213d; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }

.lock img { width: 44px; height: 44px; }
.lock.dark { background: #20242b; border-color: #20242b; color: #ffc43d; }
figcaption { margin-top: 12px; font-size: 13px; line-height: 1.5; }
.key { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 18px; font-size: 13px; }
.key span { display: flex; align-items: center; gap: 7px; }
.key i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; background: #12336b; }
</style>
