<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal · Department Data</title>
  <link rel="icon" type="image/svg+xml" href="/assets/it-matrix-icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="tour.css">
  <link rel="stylesheet" href="review.css">
  <link rel="stylesheet" href="entry.css">
</head>
<body class="portal">
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="top-row">
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-controls="sidebar" aria-expanded="false" title="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span class="tab-badge nav-badge hidden" id="nav-badge"></span>
        </button>
        <div class="top-title"><img src="/assets/it-matrix-logo.svg" alt="" width="84" height="84"><span class="top-name">IT Matrix</span></div>
        <div class="top-right">
          <span id="help-host"></span>
          <div class="who"><span id="who"></span><button class="btn sm" id="logout">Sign out</button></div>
        </div>
      </div>
    </header>
    <div class="nav-shade" id="nav-shade"></div>
    <aside class="sidebar" id="sidebar">
      <div class="side-head"><span>Menu</span><button type="button" class="side-close" id="nav-close" aria-label="Close menu">&times;</button></div>
      <nav class="tabs" id="tabs"></nav>
    </aside>
    <main class="page"><div id="banner"></div><div id="view"></div></main>
  </div>
  <script src="tour.js"></script>
  <script src="tours.js"></script>
  <script src="portal.js"></script>
  <script src="review.js"></script>
  <script src="entry.js"></script>
  <script src="builder.js"></script>
  <script src="/portal/demo.js" defer></script>
</body>
</html>
