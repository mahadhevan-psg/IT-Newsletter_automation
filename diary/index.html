<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Department Placements Diary</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/ui.css">
  <link rel="stylesheet" href="/portal/tour.css">
  <style>
    .hero { background: var(--accent); color: #fff; padding: 28px 24px; }
    .hero h1 { font-size: 24px; } .hero p { opacity: .85; margin-top: 4px; }
    .hero-in { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .hero .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
    .co { cursor: pointer; transition: border-color .12s; } .co:hover { border-color: var(--accent); }
    .co h3 { margin-bottom: 2px; } .stat-row { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
    .stat-row div b { display: block; font-size: 18px; } .stat-row div span { font-size: 11px; color: var(--muted); }
    .exp { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 14px 0; } .exp p { margin: 4px 0; white-space: pre-wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .back { margin-bottom: 14px; }
    .hero .tour-help-btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <div class="hero"><div class="hero-in"><div><h1>IT Department Placements Diary</h1><p>Where our seniors got placed, what they earned, and how they prepared.</p></div>
      <div><span id="help-host"></span> <button class="btn sm" id="chpw">Change password</button> <button class="btn sm" id="logout">Sign out</button></div></div></div>
    <main class="page"><div id="banner"></div><div id="view"></div></main>
  </div>
  <script src="/portal/tour.js"></script>
  <script src="/portal/tours.js"></script>
  <script src="diary.js"></script>
  <script src="/portal/demo.js" defer></script>
</body>
</html>
